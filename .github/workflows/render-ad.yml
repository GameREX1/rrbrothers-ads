name: Render RR Brothers Shorts Ad

on:
  push:
    branches: [main]
    paths-ignore:
      - "RR-Brothers-Shorts.mp4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pillow numpy
      - name: Render vertical advertisement
        run: python generate_ad.py
      - name: Upload MP4 as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rr-brothers-shorts
          path: RR-Brothers-Shorts.mp4
          retention-days: 30
      - name: Save MP4 in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RR-Brothers-Shorts.mp4
          git commit -m "Render RR Brothers Shorts advertisement"
          git push
